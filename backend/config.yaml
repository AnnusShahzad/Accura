# =============================================================================
# Accura – Default YAML Configuration
# =============================================================================
# This file is loaded at startup and provides defaults for self-hosted
# deployments via Docker. Environment variables override values here.

app:
  name: "Accura"
  version: "1.0.0"
  environment: "production"
  host: "0.0.0.0"
  port: 8000
  # >1 requires Redis for consistent rate limiting
  workers: 1
  debug: false
  frontend_url: "http://localhost:3000"
  # Comma-separated list of origins allowed to call the API ("*" = any)
  cors_origins: "*"

branding:
  company_name: "Accura"
  logo_url: "/static/logo.png"
  # Where contact-form submissions are emailed (empty = only stored for admins)
  support_email: ""

database:
  # "sqlite" for zero-setup local development, "postgres" for Docker /
  # production deployments.
  engine: "sqlite"
  sqlite_path: "accura_dev.db"
  host: "postgres"
  port: 5432
  name: "accura"
  user: "accura"
  password: "changeme"
  pool_size: 20

redis:
  # Leave empty to use the in-process rate limiter (single worker only).
  url: ""

jwt:
  secret: "change-me-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 30

smtp:
  host: "smtp.example.com"
  port: 587
  user: "noreply@example.com"
  password: "changeme"
  from_name: "Accura"
  from_email: "noreply@example.com"
  use_tls: true

auth:
  # Self-service sign-up. Turn off for public demos; admins and guests
  # can still log in.
  registration_enabled: true
  guest:
    # One-click throwaway accounts. Everything a guest creates is deleted
    # ttl_hours after the guest account was created.
    enabled: false
    ttl_hours: 24
    # Guests use the platform's AI keys, so keep them on a short leash
    requests_per_minute: 5
    requests_per_day: 30
    max_iterations: 3
    # New guest sessions per hour across the whole site (on top of 5 per IP)
    signups_per_hour: 60
  # Created (or promoted) on startup when both are set. Useful on hosts
  # without shell access, e.g. Render's free tier.
  bootstrap_admin:
    email: ""
    password: ""
    username: ""

ai:
  # Provider used when a request or a stored preference doesn't name one
  default_provider: "openai"
  default_generator_model: "gpt-5.2"
  default_evaluator_model: "gpt-5.1"
  # Empty = rephrase with the conversation's evaluator model
  default_reprompt_model: ""
  providers:
    openai:
      api_key: ""
      base_url: "https://api.openai.com/v1"
    deepseek:
      api_key: ""
      base_url: "https://api.deepseek.com/v1"
    anthropic:
      api_key: ""
      base_url: "https://api.anthropic.com/v1/"
    google:
      api_key: ""
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    # Any OpenAI-compatible endpoint (vLLM, Ollama, OpenRouter, NVIDIA NIM...)
    custom:
      api_key: ""
      base_url: ""

  system_prompts:
    generator: |
      You are a helpful AI assistant. Provide accurate, detailed, and well-structured responses.
    evaluator: |
      You are an expert evaluator. Score the following response on a scale of 0-100 based on
      accuracy, completeness, clarity, and relevance to the original prompt.
      Return a JSON object: {"score": <number>, "reasoning": "<brief explanation>"}
    reprompt: |
      You are a prompt engineer. The previous response scored below the threshold.
      Rephrase the following user prompt to elicit a better response from the AI.
      Keep the original intent but improve clarity and specificity.

  # Maximum MCP tool-call rounds per generation
  max_tool_rounds: 5

evaluation:
  global_threshold: 75
  default_max_iterations: 5
  default_timeout_seconds: 120

rate_limits:
  basic:
    requests_per_minute: 10
    requests_per_day: 100
    max_tokens_per_request: 4096
  pro:
    requests_per_minute: 60
    requests_per_day: 1000
    max_tokens_per_request: 16384
  business:
    requests_per_minute: 200
    requests_per_day: 10000
    max_tokens_per_request: 32768

subscriptions:
  basic:
    price_monthly: 0
    price_yearly: 0
    features:
      - "10 requests per minute"
      - "100 requests per day"
      - "Community support"
  pro:
    price_monthly: 29.99
    price_yearly: 299.99
    features:
      - "60 requests per minute"
      - "1000 requests per day"
      - "Priority support"
      - "BYOK support"
      - "MCP server integration"
  business:
    price_monthly: 99.99
    price_yearly: 999.99
    features:
      - "200 requests per minute"
      - "10000 requests per day"
      - "Dedicated support"
      - "BYOK support"
      - "MCP server integration"
      - "Custom branding"
      - "SSO integration"

security:
  # Secret used to encrypt BYOK API keys at rest. REQUIRED. A Fernet key
  # is used as-is; any other string is turned into one with SHA-256.
  encryption_key: ""
  # Allow MCP servers, custom AI endpoints and webhooks to point at
  # private/loopback addresses. Keep false on any public deployment, or
  # users can make the server fetch internal URLs.
  allow_private_urls: true

billing:
  # When stripe_secret_key is empty the platform runs in demo billing mode:
  # upgrades take effect immediately and no card is charged.
  stripe_secret_key: ""
  stripe_webhook_secret: ""
  stripe_price_ids:
    pro_monthly: ""
    pro_yearly: ""

maintenance:
  # How often (seconds) to purge expired guests and temporary chats,
  # recover stuck runs and renew demo subscriptions
  interval_seconds: 300

search:
  enabled: true
  whitelist_domains: []
  blacklist_domains: []
  google_api_key: ""
  google_cse_id: ""

mcp_servers:
  global: []
  # - name: "example-mcp"
  #   url: "https://mcp.example.com"
  #   api_key: ""

webhooks:
  slack:
    enabled: false
    default_webhook_url: ""
  teams:
    enabled: false
    default_webhook_url: ""

notifications:
  channels:
    in_app: true
    email: true
    slack: false
    teams: false
