<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; padding: 20px 0;">
    <h1 style="color: #333;">You're Invited!</h1>
  </div>
  <div style="padding: 20px; background: #f9f9f9; border-radius: 8px;">
    <p>Hi,</p>
    <p><strong>{{ inviter_name }}</strong> has invited you to join Accura.</p>
    <p>Click below to create your account:</p>
    <div style="text-align: center; padding: 20px 0;">
      <a href="{{ invite_url }}"
         style="display: inline-block; padding: 12px 32px; background: #4F46E5; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold;">
        Accept Invitation
      </a>
    </div>
  </div>
  <div style="text-align: center; padding: 20px 0; color: #999; font-size: 12px;">
    <p>&copy; {{ year | default("2026") }} Accura. All rights reserved.</p>
  </div>
</body>
</html>
