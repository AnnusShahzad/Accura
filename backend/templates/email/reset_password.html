<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; padding: 20px 0;">
    <h1 style="color: #333;">Reset Your Password</h1>
  </div>
  <div style="padding: 20px; background: #f9f9f9; border-radius: 8px;">
    <p>Hi <strong>{{ username }}</strong>,</p>
    <p>We received a request to reset your password. Click the button below to set a new one:</p>
    <div style="text-align: center; padding: 20px 0;">
      <a href="{{ reset_url }}"
         style="display: inline-block; padding: 12px 32px; background: #DC2626; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold;">
        Reset Password
      </a>
    </div>
    <p style="color: #666; font-size: 14px;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
  <div style="text-align: center; padding: 20px 0; color: #999; font-size: 12px;">
    <p>&copy; {{ year | default("2026") }} Accura. All rights reserved.</p>
  </div>
</body>
</html>
