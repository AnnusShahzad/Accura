# =============================================================================
# Accura – Render Blueprint (free tier)
#
# Dashboard → New → Blueprint → pick this repository. Render creates:
#   * accura-api  – the Sanic backend (Python web service)
#   * accura-db   – PostgreSQL (free plan)
#   * accura-web  – the Next.js frontend (optional: or deploy it on Vercel)
#
# Values marked `sync: false` are asked for when the Blueprint is created.
# See DEPLOYMENT.md for the full walkthrough.
# =============================================================================

databases:
  - name: accura-db
    plan: free
    databaseName: accura
    user: accura

services:
  - type: web
    name: accura-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Free instances are single-process; background runs live in it
      - key: APP_WORKERS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: accura-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Public demo defaults: no sign-up, one-click guest sessions,
      # and no user-supplied URLs pointing at private networks
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: GUEST_ENABLED
        value: "true"
      - key: GUEST_TTL_HOURS
        value: "24"
      - key: ALLOW_PRIVATE_URLS
        value: "false"
      # Your admin account, created on first start (no shell needed)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # At least one AI provider. For a single OpenAI-compatible endpoint
      # (OpenRouter, Groq, Together, ...) set CUSTOM_AI_* and
      # DEFAULT_AI_PROVIDER=custom plus DEFAULT_*_MODEL instead.
      - key: OPENAI_API_KEY
        sync: false
      # The frontend's public URL, used in emailed links
      - key: APP_FRONTEND_URL
        sync: false

  - type: web
    name: accura-web
    runtime: node
    plan: free
    # --include=dev: the build needs Tailwind/PostCSS/TypeScript, which npm
    # skips when NODE_ENV=production is set on the service
    buildCommand: npm ci --include=dev && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public URL + /api/v1, e.g.
      # https://accura-api.onrender.com/api/v1 (read at build time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
